<title>語彙道場</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0A0D1A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg0:#0A0D1A;
  --bg1:#141033;
  --bg2:#1E1240;
  --card:rgba(255,255,255,.055);
  --card-2:rgba(255,255,255,.09);
  --edge:rgba(255,255,255,.13);
  --edge-2:rgba(255,255,255,.22);
  --tx:#F3F4FA;
  --tx2:#A9AEC8;
  --tx3:#6E7496;
  --gold:#F2C14E;
  --gold-d:#C89528;
  --mint:#38DFA6;
  --mint-d:#0F8F68;
  --red:#FF5B6E;
  --red-d:#B32A3B;
  --disp:"Shippori Mincho B1",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN",sans-serif;
  --num:"Barlow Condensed",ui-sans-serif,sans-serif;
  --safeb:env(safe-area-inset-bottom,0px);
  --safet:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  margin:0;color:var(--tx);font-family:var(--ui);font-size:15px;line-height:1.65;
  background:var(--bg0);
  -webkit-font-smoothing:antialiased;user-select:none;
}
button{font-family:inherit;color:inherit}

/* ---- device frame ---- */
.app{
  overscroll-behavior:none;touch-action:pan-y;
  position:relative;width:100%;max-width:460px;height:100dvh;margin:0 auto;
  overflow:hidden;isolation:isolate;
  background:
    radial-gradient(120% 62% at 50% -8%, #2A1A55 0%, rgba(42,26,85,0) 62%),
    radial-gradient(90% 45% at 50% 104%, #10254A 0%, rgba(16,37,74,0) 60%),
    linear-gradient(178deg, var(--bg1) 0%, var(--bg0) 55%, #0B1024 100%);
}
.app::after{ /* 微細な紙目 */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;z-index:0;
  background-image:radial-gradient(rgba(255,255,255,.055) .5px, transparent .5px);
  background-size:3px 3px;
}
.heat{
  position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;
  transition:opacity .5s;
  background:radial-gradient(85% 45% at 50% 100%, rgba(242,193,78,.30), rgba(242,193,78,0) 70%),
             radial-gradient(85% 40% at 50% 0%, rgba(242,193,78,.18), rgba(242,193,78,0) 70%);
}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none}
.flash{position:absolute;inset:0;z-index:5;pointer-events:none;opacity:0;background:#fff}
.flash.ok{animation:fl .42s ease-out}
.flash.ng{animation:flr .42s ease-out}
@keyframes fl{0%{opacity:.30;background:var(--mint)}100%{opacity:0;background:var(--mint)}}
@keyframes flr{0%{opacity:.34;background:var(--red)}100%{opacity:0;background:var(--red)}}
.slash{
  position:absolute;left:-40%;top:44%;width:180%;height:3px;z-index:7;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff 42%,#fff 58%,transparent);
  transform:rotate(-14deg) scaleX(0);transform-origin:left center;opacity:0;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.9));
}
.slash.go{animation:slash .42s cubic-bezier(.2,.9,.2,1)}
@keyframes slash{0%{opacity:0;transform:rotate(-14deg) scaleX(0)}
  22%{opacity:1}70%{opacity:1;transform:rotate(-14deg) scaleX(1)}
  100%{opacity:0;transform:rotate(-14deg) scaleX(1)}}
.shakey{animation:shk .38s}
@keyframes shk{0%,100%{transform:translate(0,0)}
  15%{transform:translate(-7px,2px)}35%{transform:translate(6px,-2px)}
  55%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

/* ---- screens ---- */
.scr{
  position:absolute;inset:0;z-index:2;display:none;flex-direction:column;
  padding:calc(var(--safet) + 14px) 16px calc(var(--safeb) + 14px);
}
.scr.on{display:flex;animation:sIn .32s cubic-bezier(.2,.8,.25,1) both}
@keyframes sIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;margin:0 -4px;
  padding:0 4px 14px;
  -webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(180deg,#000 calc(100% - 22px),transparent)}
.scroll::-webkit-scrollbar{width:0}

/* ---- home ---- */
.logo{text-align:center;padding:6px 0 2px}
.logo .jp{
  font-family:var(--disp);font-weight:800;font-size:34px;letter-spacing:.22em;
  margin-left:.22em;line-height:1.1;
  background:linear-gradient(180deg,#FFF3D0,var(--gold) 55%,#B8801E);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 10px rgba(242,193,78,.28));
}
.logo .en{
  font-family:var(--num);font-size:11px;letter-spacing:.5em;color:var(--tx3);
  margin-left:.5em;
}
.rankbar{
  margin-top:14px;background:var(--card);border:1px solid var(--edge);
  border-radius:14px;padding:12px 14px;
}
.rankbar .r1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rankbar .title{font-family:var(--disp);font-weight:800;font-size:19px;letter-spacing:.1em;color:var(--gold)}
.rankbar .nx{font-family:var(--num);font-size:13px;color:var(--tx3);letter-spacing:.04em}
.xp{height:6px;border-radius:6px;background:rgba(255,255,255,.10);margin-top:8px;overflow:hidden}
.xp i{display:block;height:100%;border-radius:6px;
  background:linear-gradient(90deg,var(--gold-d),var(--gold));
  box-shadow:0 0 12px rgba(242,193,78,.55);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.chips{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{
  font-family:var(--num);font-size:13px;letter-spacing:.05em;color:var(--tx2);
  background:rgba(255,255,255,.05);border:1px solid var(--edge);
  border-radius:999px;padding:3px 11px;
}
.chip b{color:var(--gold);font-size:15px}
.chip.fire b{color:#FF9B4A}

.today{
  margin-top:12px;border-radius:14px;padding:13px 15px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,rgba(242,193,78,.15),rgba(242,193,78,.04));
  border:1px solid rgba(242,193,78,.30);
}
.today .lb{font-family:var(--num);font-size:11px;letter-spacing:.24em;color:var(--gold)}
.today .w{font-family:var(--disp);font-weight:800;font-size:26px;letter-spacing:.05em;margin-top:2px;line-height:1.25;text-wrap:balance}
.today .r{font-family:var(--num);font-size:12px;color:var(--tx3);letter-spacing:.08em}
.today .m{font-size:13px;color:var(--tx2);margin-top:3px}

.mlist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mcard{
  position:relative;display:flex;align-items:center;gap:13px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--edge);border-radius:16px;
  padding:14px 15px;cursor:pointer;overflow:hidden;
  transition:transform .12s cubic-bezier(.2,.8,.2,1),border-color .2s,background .2s;
}
.mcard:active{transform:scale(.975);background:var(--card-2)}
.mcard .ico{
  width:44px;height:44px;flex:none;border-radius:13px;display:grid;place-items:center;
  border:1px solid var(--edge);background:rgba(255,255,255,.05);
}
.mcard .ico svg{width:23px;height:23px}
.mcard .tx{flex:1;min-width:0}
.mcard .nm{font-family:var(--disp);font-weight:800;font-size:18px;letter-spacing:.09em}
.mcard .ds{font-size:12px;color:var(--tx3);line-height:1.5}
.mcard .rt{font-family:var(--num);font-size:13px;color:var(--tx3);text-align:right;flex:none;
  white-space:nowrap;line-height:1.25}
.mcard .rt b{display:block;font-size:19px;color:var(--gold);line-height:1.1}
.mcard.hot{border-color:rgba(242,193,78,.45);
  background:linear-gradient(120deg,rgba(242,193,78,.14),rgba(255,255,255,.05))}
.mcard.hot .ico{border-color:rgba(242,193,78,.4);background:rgba(242,193,78,.14)}
.mcard .done{
  font-family:var(--num);font-size:11px;letter-spacing:.1em;color:var(--mint);
  border:1px solid var(--mint-d);border-radius:999px;padding:1px 8px;
}
.catwrap{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.catwrap::-webkit-scrollbar{height:0}
.catb{
  flex:none;border:1px solid var(--edge);background:var(--card);border-radius:12px;
  padding:9px 13px;cursor:pointer;text-align:left;transition:transform .12s,background .2s;
}
.catb:active{transform:scale(.96);background:var(--card-2)}
.catb .cn{font-size:13px;font-weight:700;white-space:nowrap}
.catb .cc{font-family:var(--num);font-size:12px;color:var(--tx3)}
.remind{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--card);
  border:1px solid var(--edge);border-radius:14px;padding:11px 13px}
.remind .rt1{flex:1;min-width:0}
.remind .rl{font-size:13px;font-weight:700}
.remind .rs{font-size:11px;color:var(--tx3)}
.remind input[type=time]{background:rgba(255,255,255,.06);border:1px solid var(--edge);color:var(--tx);
  border-radius:9px;padding:5px 8px;font-family:var(--num);font-size:15px;color-scheme:dark}
.tog{width:44px;height:26px;border-radius:13px;border:1px solid var(--edge);background:rgba(255,255,255,.08);
  position:relative;cursor:pointer;padding:0;transition:background .2s;flex:none}
.tog i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--gold);border-color:var(--gold)}
.tog.on i{transform:translateX(18px)}
.hbar{display:flex;gap:8px;margin-top:14px}
.hbar button{
  flex:1;background:var(--card);border:1px solid var(--edge);border-radius:12px;
  padding:11px;font-size:13px;font-weight:700;cursor:pointer;transition:transform .12s,background .2s;
}
.hbar button:active{transform:scale(.97);background:var(--card-2)}
.sect{
  font-family:var(--num);font-size:12px;letter-spacing:.26em;color:var(--tx3);
  margin:18px 0 -2px;
}

/* ---- play ---- */
.top{display:flex;align-items:center;gap:10px}
.iconb{
  width:34px;height:34px;flex:none;border-radius:11px;border:1px solid var(--edge);
  background:var(--card);display:grid;place-items:center;cursor:pointer;
}
.iconb:active{transform:scale(.92)}
.iconb svg{width:16px;height:16px}
.score{font-family:var(--num);font-size:26px;line-height:1;letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.score em{font-style:normal;font-size:11px;color:var(--tx3);letter-spacing:.2em;
  display:block;font-family:var(--num)}
.top .sp{flex:1}
.lives{display:flex;gap:5px}
.life{width:11px;height:11px;border-radius:3px;transform:rotate(45deg);
  background:var(--red);box-shadow:0 0 9px rgba(255,91,110,.6);transition:all .35s}
.life.lost{background:transparent;box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.lives.hit{animation:lifeHit .45s}
@keyframes lifeHit{0%{transform:scale(1)}25%{transform:scale(1.5);filter:brightness(1.8)}
  60%{transform:scale(.9)}100%{transform:scale(1)}}
.prog{font-family:var(--num);font-size:14px;color:var(--tx3);letter-spacing:.06em}

.gauge{height:5px;border-radius:5px;background:rgba(255,255,255,.09);margin-top:11px;overflow:hidden}
.gauge i{display:block;height:100%;width:100%;border-radius:5px;
  background:linear-gradient(90deg,#4FA0FF,#38DFA6)}
.gauge.warn i{background:linear-gradient(90deg,#FF8A5B,var(--red));
  animation:pulse .55s infinite alternate}
@keyframes pulse{from{opacity:.55}to{opacity:1}}

.qzone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:10px 4px;min-height:0}
.combo{
  font-family:var(--num);font-size:15px;letter-spacing:.12em;color:var(--gold);
  height:22px;opacity:0;transform:scale(.7);
  transition:opacity .2s,transform .2s;
}
.combo.on{opacity:1;transform:scale(1)}
.combo.pop{animation:cpop .42s cubic-bezier(.2,1.6,.35,1)}
@keyframes cpop{0%{transform:scale(1)}30%{transform:scale(1.42)}100%{transform:scale(1)}}
.qkind{font-family:var(--num);font-size:12px;letter-spacing:.28em;color:var(--tx3);margin-top:2px}
.qmain{font-family:var(--disp);font-weight:800;line-height:1.3;text-wrap:balance;
  margin-top:10px;letter-spacing:.05em}
.qmain.word{font-size:clamp(38px,12.5vw,54px);
  text-shadow:0 4px 26px rgba(255,255,255,.14)}
.qmain.mean{font-size:clamp(20px,5.6vw,26px);font-weight:600;letter-spacing:.02em;
  color:var(--tx);max-width:19ch}
.qmain.word.sm{font-size:clamp(28px,9.5vw,42px)}
.qmain.word.xs{font-size:clamp(22px,7.6vw,32px);letter-spacing:.02em}
.qmain.mean.sm{font-size:clamp(17px,4.6vw,21px)}
.qzone{overflow-y:auto;overscroll-behavior:contain}
.qzone::-webkit-scrollbar{width:0}
@media (max-height:740px){
  .scr{padding-top:calc(var(--safet) + 8px);padding-bottom:calc(var(--safeb) + 10px)}
  .gauge{margin-top:8px}
  .qzone{padding:4px 4px}
  .combo{height:18px;font-size:13px}
  .qmain{margin-top:6px}
  .qmain.word{font-size:clamp(30px,10vw,42px)}
  .qmain.word.sm{font-size:clamp(26px,8.5vw,36px)}
  .qmain.word.xs{font-size:clamp(20px,6.8vw,28px)}
  .qmain.mean{font-size:clamp(17px,4.8vw,21px)}
  .qmain.mean.sm{font-size:clamp(15px,4.2vw,18px)}
  .qtag{margin-top:5px}
  .ans{gap:7px}
  .ab{min-height:48px;padding:9px 12px;font-size:14px;border-radius:13px}
  .ab .k{width:22px;height:22px;font-size:13px}
  .sheet{padding:12px 16px calc(var(--safeb) + 12px)}
  .sheet .aw{font-size:21px;margin-top:4px}
  .big{padding:12px;margin-top:10px}
}
@media (max-height:600px){
  .qkind{display:none}
  .qtag{display:none}
  .qmain.word{font-size:clamp(24px,8vw,32px)}
  .qmain.word.sm,.qmain.word.xs{font-size:clamp(20px,6.5vw,26px)}
  .qmain.mean,.qmain.mean.sm{font-size:clamp(14px,4vw,17px)}
  .ans{gap:5px}
  .ab{min-height:40px;padding:6px 11px;font-size:13px;line-height:1.35}
  .score{font-size:20px}
}
.qtag{font-family:var(--num);font-size:12px;letter-spacing:.2em;color:var(--tx3);margin-top:8px;
  display:flex;align-items:center;justify-content:center;gap:8px}
.lv{display:inline-flex;gap:3px}
.lv i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.18)}
.lv i.on{background:var(--gold);box-shadow:0 0 6px rgba(242,193,78,.7)}
.wr .t .lv{margin-left:6px;vertical-align:middle}
.wr .t .lv i{width:4px;height:4px}
.big.sub2{background:var(--card);color:var(--tx);border:1px solid var(--edge);box-shadow:none}

.ans{display:flex;flex-direction:column;gap:9px;flex:none}
.ab{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;
  background:var(--card);border:1px solid var(--edge);border-radius:15px;
  padding:12px 14px;font-size:15px;font-weight:500;line-height:1.45;cursor:pointer;
  transition:transform .11s cubic-bezier(.2,.8,.2,1),background .18s,border-color .18s,opacity .25s;
}
.ab:active:not(:disabled){transform:scale(.975);background:var(--card-2)}
.ab .k{
  width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;
  font-family:var(--num);font-size:14px;color:var(--tx3);
  border:1px solid var(--edge);transition:all .18s;
}
.ab.right{background:linear-gradient(100deg,rgba(56,223,166,.28),rgba(56,223,166,.10));
  border-color:var(--mint);box-shadow:0 0 24px rgba(56,223,166,.28);animation:rpop .4s}
.ab.right .k{border-color:var(--mint);color:var(--mint)}
.ab.wrong{background:linear-gradient(100deg,rgba(255,91,110,.26),rgba(255,91,110,.08));
  border-color:var(--red)}
.ab.wrong .k{border-color:var(--red);color:var(--red)}
.ab.fade{opacity:.28}
@keyframes rpop{0%{transform:scale(1)}35%{transform:scale(1.028)}100%{transform:scale(1)}}

/* ---- answer sheet ---- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:8;
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.9,.25,1);
  background:linear-gradient(180deg,#171233,#0D1024);
  border-top:1px solid var(--edge-2);border-radius:20px 20px 0 0;
  padding:16px 18px calc(var(--safeb) + 16px);
  box-shadow:0 -18px 46px rgba(0,0,0,.6);
}
.sheet.up{transform:translateY(0)}
.sheet .vd{display:flex;align-items:center;gap:9px;font-family:var(--num);
  font-size:17px;letter-spacing:.14em}
.sheet.ok .vd{color:var(--mint)}
.sheet.ng .vd{color:var(--red)}
.sheet .vd .pts{margin-left:auto;font-size:20px;color:var(--gold)}
.sheet .aw{font-family:var(--disp);font-weight:800;font-size:25px;letter-spacing:.05em;margin-top:7px}
.sheet .ar{font-family:var(--num);font-size:13px;color:var(--tx3);letter-spacing:.08em}
.sheet .am{font-size:14px;color:var(--tx2);margin-top:5px}
.big{
  width:100%;flex:none;margin-top:13px;border:none;border-radius:14px;padding:15px;
  font-size:16px;font-weight:900;letter-spacing:.12em;cursor:pointer;
  background:linear-gradient(180deg,#FFD97A,var(--gold) 60%,var(--gold-d));
  color:#241703;box-shadow:0 6px 18px rgba(242,193,78,.3);
  transition:transform .12s,filter .18s;
}
.big:active{transform:scale(.98) translateY(1px);filter:brightness(.95)}
.big.sub{background:var(--card);color:var(--tx);border:1px solid var(--edge);box-shadow:none}

/* ---- result ---- */
.res-top{text-align:center;padding:6px 0 2px}
.stamp{
  display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;
  border:3px solid var(--gold);color:var(--gold);margin:10px auto 0;
  font-family:var(--disp);font-weight:800;font-size:40px;letter-spacing:.08em;
  text-indent:.08em;box-shadow:0 0 40px rgba(242,193,78,.25),inset 0 0 30px rgba(242,193,78,.12);
  animation:stamp .5s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes stamp{0%{transform:scale(2.4) rotate(-14deg);opacity:0}
  60%{opacity:1}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.stamp.bad{border-color:var(--red);color:var(--red);
  box-shadow:0 0 40px rgba(255,91,110,.22),inset 0 0 30px rgba(255,91,110,.12)}
.res-score{font-family:var(--num);font-size:52px;line-height:1;margin-top:14px;
  font-variant-numeric:tabular-nums}
.res-lb{font-family:var(--num);font-size:12px;letter-spacing:.3em;color:var(--tx3)}
.newbest{display:inline-block;margin-top:8px;font-family:var(--num);font-size:12px;
  letter-spacing:.2em;color:#241703;background:var(--gold);border-radius:999px;padding:2px 12px;
  animation:cpop .6s .3s both}
.res3{display:flex;gap:8px;margin-top:16px}
.res3 div{flex:1;background:var(--card);border:1px solid var(--edge);border-radius:13px;
  padding:10px;text-align:center}
.res3 .k{font-size:11px;color:var(--tx3)}
.res3 .v{font-family:var(--num);font-size:23px;line-height:1.1}
.gain-xp{text-align:center;font-family:var(--num);font-size:14px;color:var(--gold);margin-top:12px;
  letter-spacing:.1em}

.wl{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.wr{
  background:var(--card);border:1px solid var(--edge);border-radius:12px;padding:10px 12px;
  border-left:3px solid var(--red);
}
.wr.got{border-left-color:var(--mint)}
.wr .w{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.04em}
.wr .w em{font-style:normal;font-family:var(--num);font-size:11px;color:var(--tx3);
  margin-left:8px;letter-spacing:.06em}
.wr .m{font-size:13px;color:var(--tx2)}
.wr .t{font-family:var(--num);font-size:11px;color:var(--tx3);letter-spacing:.08em}

let AC=null;
function ac(){
  if(S.mute)return null;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    return AC;
  }catch(e){return null;}
}
function tone(f,dur,type,vol,at){
  const c=ac();if(!c)return;
  const t0=c.currentTime+(at||0);
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"triangle";o.frequency.setValueAtTime(f,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+dur+.02);
}

/* ---- BGM（琴のアルペジオを生成。音源ファイル不要） ---- */
const BGM={gain:null,timer:null,next:0,step:0,mode:"off",loop:0};
const D4=293.66,F4=349.23,G4=392,A4=440,C5=523.25,D5=587.33,F5=698.46,G5=783.99;
const KOTO=[
  D4,A4,D5,A4, F4,A4,C5,A4,   G4,D5,F5,D5, A4,D5,C5,A4,
  F4,A4,C5,A4, D5,C5,A4,F4,   G4,A4,C5,D5, -1,A4,G5,D5
];
const BASSN=[D4/4,G4/4,F4/4,G4/4];
function bgmVol(){return BGM.mode==="play"?.62:BGM.mode==="calm"?.36:0;}
function bgmCtx(){
  const c=ac();if(!c)return null;
  if(!BGM.gain){
    BGM.gain=c.createGain();BGM.gain.gain.value=0;
    const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
    BGM.gain.connect(lp);lp.connect(c.destination);
  }
  return c;
}
function bgmStart(mode){
  BGM.mode=mode;
  if(S.bgmOff||S.mute){bgmStop();return;}
  const c=bgmCtx();if(!c)return;
  const g=BGM.gain.gain;g.cancelScheduledValues(c.currentTime);
  g.setValueAtTime(g.value,c.currentTime);
  g.linearRampToValueAtTime(bgmVol(),c.currentTime+.9);
  if(!BGM.timer){BGM.next=c.currentTime+.08;BGM.step=0;BGM.timer=setInterval(bgmTick,90);}
}
function bgmStop(){
  if(!BGM.gain||!AC)return;
  const g=BGM.gain.gain,c=AC;
  g.cancelScheduledValues(c.currentTime);g.setValueAtTime(g.value,c.currentTime);
  g.linearRampToValueAtTime(0,c.currentTime+.5);
  if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null;}
}
function bgmNote(f,t,vol,dec,type){
  const c=AC,o=c.createOscillator(),g=c.createGain();
  o.type=type||"triangle";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+dec+.02);
}
function bgmTick(){
  const c=AC;if(!c)return;
  const eighth=60/84/2;
  while(BGM.next<c.currentTime+.25){
    const s=BGM.step%32,bar=Math.floor(s/8),beat=s%8,t=BGM.next;
    const f=KOTO[s];
    const rest=(BGM.loop%3===2&&beat%2===1&&Math.random()<.35);
    if(f>0&&!rest){bgmNote(f,t,.16,.55);bgmNote(f*2,t,.035,.16,"sine");}
    if(beat===0){bgmNote(BASSN[bar],t,.20,1.3,"sine");}
    if(BGM.mode==="play"){
      if(beat===0||beat===4){const o=c.createOscillator(),g=c.createGain();
        o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(42,t+.09);
        g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.0001,t+.14);
        o.connect(g);g.connect(BGM.gain);o.start(t);o.stop(t+.16);}
      if(beat===6)bgmNote(1800,t,.05,.08,"square");
    }
    if(s===0){bgmNote(2637,t,.07,1.8,"sine");}
    BGM.step++;if(BGM.step%32===0)BGM.loop++;
    BGM.next+=eighth;
  }
}

const cv=$("fx"),cx=cv.getContext("2d");let parts=[],raf=null;
function fit(){const r=$("app").getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);
  cv.width=r.width*d;cv.height=r.height*d;cv.style.width=r.width+"px";cv.style.height=r.height+"px";
  cx.setTransform(d,0,0,d,0,0);}
addEventListener("resize",fit);fit();
function burst(x,y,cols,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=2+Math.random()*7;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-2.5,life:1,
      c:cols[i%cols.length],r:1.5+Math.random()*3});
  }
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.26;p.vx*=.985;p.life-=.018;
    cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.3);cx.fill();
  });
  cx.globalAlpha=1;
  raf=parts.length?requestAnimationFrame(loop):null;
  if(!parts.length)cx.clearRect(0,0,cv.width,cv.height);
}
function flash(kind){
  const f=$("flash");f.className="flash";void f.offsetWidth;f.className="flash "+kind;
}
function slash(){const s=$("slash");s.className="slash";void s.offsetWidth;s.className="slash go";}
function shake(){const a=$("app");a.classList.remove("shakey");void a.offsetWidth;a.classList.add("shakey");}

   ========================================================== */
function show(n){
  document.querySelectorAll(".scr").forEach(s=>s.classList.remove("on"));
  $("s-"+n).classList.add("on");
  document.querySelectorAll(".scroll").forEach(s=>s.scrollTop=0);
}

 time:'<svg viewBox="0 0 24 24" fill="none" stroke="#4FA0FF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>',
 survival:'<svg viewBox="0 0 24 24" fill="none" stroke="#FF5B6E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.4-7-9.7A4.2 4.2 0 0 1 12 8a4.2 4.2 0 0 1 7 3.3C19 16.6 12 21 12 21z"/></svg>',
 review:'<svg viewBox="0 0 24 24" fill="none" stroke="#38DFA6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg>'
};
const MODE={
 daily:{name:"今日の修行",ds:"日替わりの10問。続けて連勝日数を伸ばす",n:10,lives:0,perQ:0,total:0},
 time:{name:"時間攻め",ds:"60秒。速く答えるほど高得点",n:999,lives:0,perQ:0,total:60},
 survival:{name:"真剣勝負",ds:"1問12秒・三度倒れたら終わり",n:999,lives:3,perQ:12,total:0},
 review:{name:"弱点復習",ds:"間違えた語だけを狙って潰す",n:12,lives:0,perQ:0,total:0},
 cat:{name:"分野別",ds:"",n:12,lives:0,perQ:0,total:0},
 fix:{name:"取りこぼし復習",ds:"",n:12,lives:0,perQ:0,total:0}
};

function renderHome(){
  const rnd=mulberry32(seedOf("w"+todayStr()));
  const t=DATA[Math.floor(rnd()*DATA.length)];
  $("tw").textContent=t.w;$("tr").textContent=t.r||CATS[t.c];
  $("tm").textContent=t.m;

  const ti=titleOf(S.exp);
  $("rk-title").textContent=ti.cur[1];
  $("rk-next").textContent=ti.next?ti.next[1]+"まで "+(ti.next[0]-S.exp):"皆伝の極み";
  const base=ti.cur[0],span=ti.next?ti.next[0]-base:1;
  $("rk-xp").style.width=(ti.next?Math.min(100,(S.exp-base)/span*100):100)+"%";

  $("ch-streak").innerHTML="連勝 <b>"+S.streak.days+"</b> 日";
  $("ch-learn").innerHTML="習得 <b>"+learned()+"</b> / "+DATA.length;
  const n=totalO()+totalX();
  $("ch-acc").innerHTML="正答率 <b>"+(n?Math.round(totalO()/n*100):0)+"</b>%";

  const done=S.dailyDone===todayStr();
  $("mlist").innerHTML=["daily","time","survival","review"].map(k=>{
    const m=MODE[k];let rt="";
    if(k==="daily")rt=done?'<span class="done">済</span>':'<div class="rt">全<b>10</b></div>';
    else if(k==="review"){const w=weakList().length;rt='<div class="rt"><b>'+w+'</b>語</div>';}
    else rt='<div class="rt">BEST<b>'+(S.best[k]||0)+'</b></div>';
    return '<button class="mcard'+(k==="daily"&&!done?" hot":"")+'" data-m="'+k+'">'+
      '<div class="ico">'+ICONS[k]+'</div><div class="tx"><div class="nm">'+m.name+
      '</div><div class="ds">'+m.ds+'</div></div>'+rt+'</button>';
  }).join("");
  $("mlist").querySelectorAll(".mcard").forEach(b=>b.onclick=()=>start(b.dataset.m));

  $("catwrap").innerHTML=Object.entries(CATS).map(([k,v])=>{
    const all=DATA.filter(d=>d.c===k),got=all.filter(isGot).length;
    return '<button class="catb" data-c="'+k+'"><div class="cn">'+v+
      '</div><div class="cc">'+got+" / "+all.length+'</div></button>';
  }).join("");
  $("catwrap").querySelectorAll(".catb").forEach(b=>b.onclick=()=>start("cat",b.dataset.c));

  $("btn-sound").textContent=S.mute?"効果音 OFF":"効果音 ON";
  $("btn-bgm").textContent=S.bgmOff?"BGM OFF":"BGM ON";
  $("remind").hidden=!NATIVE;
  $("rem-tog").classList.toggle("on",!!S.remind.on);
  $("rem-time").value=S.remind.time||"20:00";
  $("foot-n").textContent=DATA.length+"語 / "+DATA.length*2+"問 収録";
}

/* ==========================================================
   ゲーム進行
   ========================================================== */
let G=null,raf2=null,qStart=0;
function makeQ(item,rnd){
  const pool=DATA.filter(d=>d.c===item.c&&d.id!==item.id);
  const opts=shuffle([item,...pick(pool,3,rnd)],rnd);
  return{item,dir:rnd()<.5?0:1,opts,answer:opts.indexOf(item)};
}
function start(mode,cat,items){
  const cfg=MODE[mode];let list,rnd=Math.random;
  if(mode==="daily"){
    rnd=mulberry32(seedOf("d"+todayStr()));
    list=pick(DATA,10,rnd);
  }
  else if(mode==="review"){
    const w=weakList();
    if(!w.length){alert("まだ取りこぼした語がありません。まずは他の稽古で語を集めましょう。");return;}
    list=pick(w,Math.min(12,w.length));
  }
  else if(mode==="fix"){
    list=shuffle(items.slice());
    if(list.length<5){ /* 少なければ同じ分野の未習得語で補う */
      const cats=new Set(list.map(d=>d.c));
      const extra=DATA.filter(d=>cats.has(d.c)&&!isGot(d)&&!list.includes(d));
      list=list.concat(pick(extra,5-list.length));
    }
  }
  else if(mode==="cat"){
    const p=DATA.filter(d=>d.c===cat);list=pick(p,Math.min(12,p.length));
  }
  else list=shuffle(DATA.slice());

  G={mode,cat,cfg,rnd,list,items,i:0,score:0,combo:0,maxCombo:0,hit:0,miss:0,exp:0,
     lives:cfg.lives,deadline:0,log:[],locked:false,ended:false};
  sfxStart();bgmStart("play");
  $("heat").style.opacity=0;
  $("combo").className="combo";$("combo").textContent="";
  show("play");nextQ();
  if(cfg.total){G.deadline=performance.now()+cfg.total*1000;runTimer();}
}
function nextQ(){
  if(!G||G.ended)return;
  if(G.cfg.lives&&G.lives<=0)return;
  $("sheet").classList.remove("up");
  if(G.i>=G.list.length){
    if(G.mode==="time")G.list=G.list.concat(shuffle(DATA.slice()));
    else return end();
  }
  const q=makeQ(G.list[G.i],G.rnd);G.q=q;G.locked=false;
  if(G.combo<2){$("combo").className="combo";$("combo").textContent="";}
  $("qkind").textContent=q.dir===0?"この語の意味は":"この意味の語は";
  const txt=q.dir===0?q.item.w:q.item.m,L=txt.length;
  $("qmain").className="qmain "+(q.dir===0?"word"+(L>=10?" xs":L>=7?" sm":""):"mean"+(L>=22?" sm":""));
  $("qmain").textContent=q.dir===0?q.item.w:q.item.m;
  $("qtag").innerHTML=(q.dir===0?CATS[q.item.c]+" ・ ":"")+LVNAME[q.item.lv-1]+lvDots(q.item.lv);
  $("ans").innerHTML=q.opts.map((o,i)=>
    '<button class="ab" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>'+
    esc(q.dir===0?o.m:o.w)+'</span></button>').join("");
  $("ans").querySelectorAll(".ab").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  updHud();qStart=performance.now();
  if(G.cfg.perQ){G.deadline=performance.now()+G.cfg.perQ*1000;runTimer();}
  else if(!G.cfg.total){$("gauge-bar").style.width="0%";$("gauge").classList.remove("warn");}
}
function runTimer(){
  cancelAnimationFrame(raf2);
  const span=(G.cfg.perQ||G.cfg.total)*1000;
  (function step(){
    if(!G||G.ended)return;
    const left=G.deadline-performance.now(),p=Math.max(0,Math.min(1,left/span));
    $("gauge-bar").style.width=(p*100)+"%";
    $("gauge").classList.toggle("warn",p<.28);
    if(G.cfg.total){
      const s=Math.ceil(left/1000);
      if(s<=5&&s>0&&G.tick!==s){G.tick=s;sfxTick(s<=1);}
    }
    if(left<=0){
      if(G.cfg.total)return end();
      if(!G.locked)return answer(-1);
      return;
    }
    raf2=requestAnimationFrame(step);
  })();
}
function answer(idx){
  if(!G||G.locked)return;
  G.locked=true;
  const q=G.q,ok=idx===q.answer,sec=(performance.now()-qStart)/1000;
  [...$("ans").children].forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer)b.classList.add("right");
    else if(i===idx)b.classList.add("wrong");
    else b.classList.add("fade");
  });
  let gain=0;
  if(ok){
    G.hit++;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
    const speed=Math.max(0,Math.round((1-Math.min(sec,8)/8)*60));
    const mult=Math.min(3,1+G.combo*.1);
    gain=Math.round((BASE[q.item.lv-1]+speed)*mult);
    G.score+=gain;G.exp+=10+Math.min(20,G.combo*2);
    sfxOk(G.combo);buzz(14);flash("ok");slash();
    const r=$("app").getBoundingClientRect();
    burst(r.width/2,r.height*.42,["#F2C14E","#FFF3D0","#38DFA6","#fff"],G.combo>=5?34:22);
    const c=$("combo");
    if(G.combo>=2){
      c.textContent=G.combo+" 連答  ×"+mult.toFixed(1);
      c.className="combo on";void c.offsetWidth;c.className="combo on pop";
    }
    $("heat").style.opacity=Math.min(.9,Math.max(0,(G.combo-2)*.16));
  }else{
    G.miss++;G.combo=0;
    if(G.cfg.lives){
      G.lives--;
      const lv=$("hud-lives");lv.classList.remove("hit");void lv.offsetWidth;lv.classList.add("hit");
    }
    sfxNg();buzz([45,60,45]);flash("ng");shake();
    $("combo").className="combo";$("heat").style.opacity=0;
  }
  const s=S.stat[q.item.id]||(S.stat[q.item.id]={o:0,x:0});ok?s.o++:s.x++;
  G.log.push({item:q.item,ok});save();

  $("sheet").className="sheet "+(ok?"ok":"ng");
  setTimeout(()=>{if(G&&!G.ended&&G.locked)$("sheet").classList.add("up");},340);
  $("sh-verdict").textContent=ok?"正 解":(idx===-1?"時間切れ":"不 正 解");
  $("sh-pts").textContent=gain?"+"+gain:"";
  $("sh-word").textContent=q.item.w;
  $("sh-read").textContent=q.item.r?q.item.r:CATS[q.item.c];
  $("sh-mean").textContent=q.item.m;
  updHud();G.i++;

  if(G.cfg.lives&&G.lives<=0){setTimeout(()=>end("lose"),1500);return;}
  if(G.mode==="time"&&ok)setTimeout(()=>{if(G&&!G.ended&&G.locked)nextQ();},1250);
}
function updHud(){
  $("hud-score").textContent=G.score;
  $("hud-lives").innerHTML=G.cfg.lives?
    Array.from({length:G.cfg.lives},(_,i)=>'<span class="life'+(i<G.cfg.lives-G.lives?" lost":"")+'"></span>').join(""):"";
  const total=Math.min(G.cfg.n,G.list.length);
  $("hud-prog").textContent=G.cfg.n<900?Math.min(G.i+1,total)+" / "+total:"第"+(G.i+1)+"問";
}
const RANKS=[[3000,"名人"],[2200,"師範"],[1500,"皆伝"],[950,"目録"],[550,"初伝"],[250,"門下生"],[0,"見習い"]];
function end(reason){
  if(!G||G.ended)return;
  G.ended=true;cancelAnimationFrame(raf2);
  $("sheet").classList.remove("up");
  const n=G.hit+G.miss,acc=n?Math.round(G.hit/n*100):0;
  if(G.mode==="daily"&&S.dailyDone!==todayStr()){
    const y=new Date();y.setDate(y.getDate()-1);
    const ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
    S.streak.days=(S.streak.last===ys)?S.streak.days+1:1;
    S.streak.last=todayStr();S.dailyDone=todayStr();
  }
  const best=G.score>(S.best[G.mode]||0);
  if(best)S.best[G.mode]=G.score;
  S.exp+=G.exp;save();
  reason==="lose"?sfxLose():sfxWin();

  $("res-mode").textContent=(reason==="lose"?"三度倒れる ・ ":"")+G.cfg.name+(G.mode==="cat"?" ・ "+CATS[G.cat]:"");
  $("res-stamp").className="stamp"+(reason==="lose"?" bad":"");
  $("res-stamp").textContent=reason==="lose"?"不覚":
    (RANKS.find(r=>G.score>=r[0])||RANKS[RANKS.length-1])[1];
  $("res-hit").textContent=G.hit+"/"+n;
  $("res-acc").textContent=acc+"%";
  $("res-combo").textContent=G.maxCombo;
  $("res-xp").textContent="経験値 +"+G.exp;
  $("res-best").innerHTML=best&&G.score>0?'<div class="newbest">自己最高記録</div>':"";
  const miss=G.log.filter(l=>!l.ok);
  $("res-lt").textContent=miss.length?"取りこぼした語  "+miss.length:"出題された語  "+G.log.length;
  const rows=miss.length?miss:G.log;
  $("res-list").innerHTML='<div class="wl">'+rows.map(l=>rowHtml(l.item,l.ok)).join("")+"</div>";
  const fixBtn=$("btn-fix");
  if(miss.length){fixBtn.hidden=false;fixBtn.textContent="取りこぼした "+miss.length+" 語を今すぐ復習";
    $("btn-again").className="big sub2";}
  else{fixBtn.hidden=true;$("btn-again").className="big";}
  G.missItems=miss.map(l=>l.item);
  bgmStart("calm");
  show("result");
  countUp($("res-score"),G.score);
  if(G.score>0&&reason!=="lose")setTimeout(()=>{const r=$("app").getBoundingClientRect();
    burst(r.width/2,r.height*.30,["#F2C14E","#FFF3D0","#fff"],40);},260);
}
function countUp(el,to){
  const t0=performance.now(),dur=700;
  (function s(){
    const p=Math.min(1,(performance.now()-t0)/dur);
    el.textContent=Math.round(to*(1-Math.pow(1-p,3)));
    if(p<1)requestAnimationFrame(s);
  })();
}
function lvDots(lv){return '<span class="lv">'+[1,2,3].map(i=>'<i'+(i<=lv?' class="on"':'')+'></i>').join("")+'</span>';}
function rowHtml(it,ok){
  return '<div class="wr '+(ok?"got":"")+'"><div class="w">'+esc(it.w)+
    (it.r?'<em>'+esc(it.r)+'</em>':"")+'</div><div class="m">'+esc(it.m)+
    '</div><div class="t">'+CATS[it.c]+lvDots(it.lv)+'</div></div>';
}

/* ---- 語彙帳 ---- */
let bf="all";
function renderBook(){
  const fs=[["all","すべて"],["weak","苦手"],["got","習得済み"]].concat(Object.entries(CATS));
  $("bk-filt").innerHTML=fs.map(([k,v])=>
    '<button data-f="'+k+'"'+(bf===k?' class="on"':'')+'>'+v+'</button>').join("");
  $("bk-filt").querySelectorAll("button").forEach(b=>b.onclick=()=>{bf=b.dataset.f;sfxTap();renderBook();});
  let l=DATA.filter(d=>S.stat[d.id]);
  if(bf==="weak")l=weakList();
  else if(bf==="got")l=l.filter(isGot);
  else if(bf!=="all")l=l.filter(d=>d.c===bf);
  $("bk-list").innerHTML=l.length?
    '<div class="wl">'+l.map(d=>{const s=S.stat[d.id];
      return rowHtml(d,isGot(d)).replace('</div><div class="t">',
        '</div><div class="t">正'+s.o+" 誤"+s.x+" ・ ");}).join("")+"</div>"
    :'<div class="empty">まだ記録がありません。稽古を始めると、出会った語がここに集まります。</div>';
}

/* ---- 操作 ---- */
$("btn-next").onclick=()=>{sfxTap();nextQ();};
$("btn-quit").onclick=()=>{
  if(G&&!G.ended){
    if(G.hit+G.miss===0){G.ended=true;cancelAnimationFrame(raf2);goHome();return;}
    if(confirm("稽古をここで終えますか？ ここまでの結果が出ます。"))end();
  }else goHome();
};
$("btn-again").onclick=()=>start(G.mode,G.cat,G.items);
$("btn-fix").onclick=()=>start("fix",null,G.missItems);
const goHome=()=>{renderHome();show("home");bgmStart("calm");};
$("btn-home").onclick=goHome;
$("btn-home2").onclick=goHome;
$("btn-book").onclick=()=>{sfxTap();renderBook();show("book");};
$("btn-sound").onclick=()=>{S.mute=!S.mute;save();renderHome();if(!S.mute)sfxTap();bgmStart(BGM.mode==="off"?"calm":BGM.mode);};
$("btn-bgm").onclick=()=>{S.bgmOff=!S.bgmOff;save();renderHome();bgmStart(BGM.mode==="off"?"calm":BGM.mode);};
$("rem-tog").onclick=async()=>{
  S.remind.on=!S.remind.on;save();sfxTap();
  const ok=await applyReminder();
  if(S.remind.on&&!ok){S.remind.on=false;save();$("rem-note").textContent="通知が許可されていません。設定アプリから許可してください";}
  else $("rem-note").textContent=S.remind.on?"毎日 "+S.remind.time+" に届きます":"アプリを閉じていても届きます";
  $("rem-tog").classList.toggle("on",!!S.remind.on);
};
$("rem-time").onchange=()=>{S.remind.time=$("rem-time").value||"20:00";save();if(S.remind.on)applyReminder();
  $("rem-note").textContent=S.remind.on?"毎日 "+S.remind.time+" に届きます":"アプリを閉じていても届きます";};
/* 最初のタップでBGMを起動（ブラウザの自動再生制限のため） */
document.addEventListener("pointerdown",()=>{if(BGM.mode==="off")bgmStart("calm");},{once:true});
$("btn-reset").onclick=()=>{
  if(confirm("記録・語彙帳・称号をすべて消します。よろしいですか？")){
    const m=S.mute;S=JSON.parse(JSON.stringify(defState));S.mute=m;save();renderHome();
  }
};
addEventListener("keydown",e=>{
  if(!$("s-play").classList.contains("on"))return;
  if(e.key>="1"&&e.key<="4"){const b=$("ans").querySelector('[data-i="'+(+e.key-1)+'"]');if(b&&!b.disabled)b.click();}
  if((e.key==="Enter"||e.key===" ")&&$("sheet").classList.contains("up")){e.preventDefault();nextQ();}
});


document.addEventListener("visibilitychange",()=>{
  if(document.hidden)bgmStop();else if(BGM.mode!=="off")bgmStart(BGM.mode);
});
renderHome();
nativeRestore();
if("serviceWorker"in navigator&&!NATIVE&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
